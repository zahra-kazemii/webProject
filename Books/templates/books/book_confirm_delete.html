{% extends 'base.html' %}
{% block title %}حذف کتاب{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center">
      <h4 class="mb-3">حذف کتاب</h4>
      <p>آیا از حذف کتاب <strong>«{{ book.title }}»</strong> مطمئن هستید؟</p>
      <p class="text-danger small">با حذف کتاب، تاریخچه‌ی امانت‌ها و رزروهای مربوط به آن هم پاک می‌شود.</p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">بله، حذف شود</button>
        <a href="{% url 'book_detail' book.pk %}" class="btn btn-outline-secondary">انصراف</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
